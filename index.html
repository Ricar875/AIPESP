<style>
  :root{
    --indigo-deep:#12183a;
    --indigo-mid:#1c2657;
    --indigo-soft:#2a3576;
    --gold:#c9a13b;
    --gold-bright:#f0c869;
    --red-peru:#c81430;
    --bronze:#8a6435;
    --cream:#f4ecd8;
    --stone:#efe9d8;
    --ink:#20182a;
    --max:1180px;
  }

  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  @media (prefers-reduced-motion: reduce){
    html{scroll-behavior:auto;}
    *{animation-duration:0.001ms !important; transition-duration:0.001ms !important;}
  }

  body{
    margin:0;
    background:var(--cream);
    color:var(--ink);
    font-family:'Lora', serif;
    line-height:1.65;
  }

  h1,h2,h3,.eyebrow{
    font-family:'Cinzel', serif;
    letter-spacing:.03em;
  }

  a{color:inherit;}

  /* -------- chakana step-diamond motif, used as a quiet divider -------- */
  .chakana-rule{
    height:14px;
    margin:0 auto;
    width:100%;
    background-image:
      linear-gradient(45deg, var(--gold) 25%, transparent 25%),
      linear-gradient(-45deg, var(--gold) 25%, transparent 25%);
    background-size:14px 14px;
    background-position:0 0;
    opacity:.55;
  }

  /* ================= NAV ================= */
  header{
    position:sticky; top:0; z-index:50;
    background:var(--indigo-deep);
    border-bottom:3px solid var(--gold);
  }
  .nav-inner{
    max-width:var(--max); margin:0 auto;
    display:flex; align-items:center; justify-content:space-between;
    padding:.6rem 1.2rem;
  }
  .brand{
    display:flex; align-items:center; gap:.7rem;
    color:var(--gold-bright);
    text-decoration:none;
    font-family:'Cinzel', serif;
    font-weight:700;
    font-size:1.05rem;
  }
  .brand img{
    height:44px; width:44px; border-radius:50%;
    border:2px solid var(--gold);
    object-fit:cover;
  }
  nav ul{
    list-style:none; display:flex; gap:1.6rem; margin:0; padding:0;
  }
  nav a{
    text-decoration:none;
    color:var(--stone);
    font-size:.86rem;
    letter-spacing:.05em;
    text-transform:uppercase;
    padding:.4rem 0;
    border-bottom:2px solid transparent;
    transition:border-color .2s, color .2s;
  }
  nav a:hover, nav a.active{
    color:var(--gold-bright);
    border-color:var(--gold);
  }
  .menu-btn{
    display:none;
    background:none; border:1px solid var(--gold);
    color:var(--gold-bright);
    font-size:1.3rem;
    padding:.25rem .6rem;
    border-radius:6px;
    cursor:pointer;
  }
  @media (max-width:860px){
    .menu-btn{display:block;}
    nav{
      position:absolute; top:100%; left:0; right:0;
      background:var(--indigo-deep);
      border-bottom:3px solid var(--gold);
      max-height:0; overflow:hidden;
      transition:max-height .3s ease;
    }
    nav.open{max-height:400px;}
    nav ul{flex-direction:column; gap:0; padding:.5rem 1.2rem 1rem;}
    nav a{display:block; padding:.7rem 0; border-bottom:1px solid rgba(255,255,255,.08);}
  }

  /* ================= HERO ================= */
  .hero{
    position:relative;
    background:
      radial-gradient(ellipse at 50% -10%, var(--indigo-soft) 0%, var(--indigo-deep) 55%, #0b0f28 100%);
    color:var(--stone);
    padding:5.5rem 1.2rem 4.5rem;
    text-align:center;
    overflow:hidden;
  }
  .hero::before{
    content:"";
    position:absolute; inset:0;
    background-image:
      repeating-linear-gradient(45deg, rgba(201,161,59,.06) 0 2px, transparent 2px 26px),
      repeating-linear-gradient(-45deg, rgba(201,161,59,.06) 0 2px, transparent 2px 26px);
    pointer-events:none;
  }
  .hero-inner{position:relative; max-width:760px; margin:0 auto;}
  .hero img.seal{
    width:150px; height:150px; border-radius:50%;
    border:3px solid var(--gold);
    box-shadow:0 0 0 6px rgba(201,161,59,.15), 0 20px 50px rgba(0,0,0,.45);
    margin-bottom:1.6rem;
    object-fit:cover;
  }
  .eyebrow{
    color:var(--gold-bright);
    font-size:.78rem;
    text-transform:uppercase;
    letter-spacing:.22em;
    margin:0 0 .9rem;
  }
  .hero h1{
    font-size:clamp(1.8rem, 4.5vw, 2.9rem);
    margin:0 0 1rem;
    color:#fff;
  }
  .hero p.lead{
    font-size:1.12rem;
    color:var(--stone);
    opacity:.92;
    max-width:620px;
    margin:0 auto;
  }

  /* ================= SECTIONS ================= */
  section{padding:4.2rem 1.2rem;}
  .section-inner{max-width:var(--max); margin:0 auto;}
  .section-head{text-align:center; max-width:680px; margin:0 auto 2.6rem;}
  .section-head .eyebrow{color:var(--bronze);}
  .section-head h2{font-size:clamp(1.5rem,3.2vw,2.1rem); margin:.2rem 0 .8rem; color:var(--indigo-deep);}
  .section-head p{color:#5a5342; margin:0;}

  section:nth-of-type(odd){background:var(--cream);}
  section:nth-of-type(even){background:var(--stone);}

  /* ---- Missão / Objetivo cards ---- */
  .mission-grid{
    display:grid; gap:1.6rem;
    grid-template-columns:repeat(auto-fit, minmax(230px,1fr));
  }
  .mission-card{
    background:#fff;
    border:1px solid #e4dabf;
    border-top:4px solid var(--gold);
    border-radius:6px;
    padding:1.8rem 1.5rem;
  }
  .mission-card h3{
    font-size:1.05rem; margin:0 0 .6rem; color:var(--indigo-deep);
  }
  .mission-card p{margin:0; color:#4a4536; font-size:.96rem;}

  /* ---- Diretoria ---- */
  .board-grid{
    display:grid; gap:1.8rem;
    grid-template-columns:repeat(auto-fit, minmax(230px,1fr));
  }
  .board-card{
    text-align:center;
    background:linear-gradient(180deg,#fff, #fbf6e8);
    border:1px solid #e4dabf;
    border-radius:8px;
    padding:2rem 1.2rem 1.6rem;
  }
  .board-avatar{
    width:82px; height:82px; margin:0 auto 1rem;
    border-radius:50%;
    background:radial-gradient(circle at 35% 30%, var(--gold-bright), var(--gold) 55%, var(--bronze) 100%);
    display:flex; align-items:center; justify-content:center;
    font-family:'Cinzel', serif; font-weight:700; font-size:1.6rem;
    color:var(--indigo-deep);
    border:2px solid var(--bronze);
  }
  .board-card .cargo{
    text-transform:uppercase; letter-spacing:.1em; font-size:.74rem;
    color:var(--red-peru); font-weight:600; margin-bottom:.35rem;
  }
  .board-card .nome{font-family:'Cinzel', serif; font-size:1rem; color:var(--indigo-deep);}

  /* ---- Serviços ---- */
  .services-grid{
    display:grid; gap:1.4rem;
    grid-template-columns:repeat(auto-fit, minmax(250px,1fr));
  }
  .service-card{
    background:#fff; border-radius:8px; padding:1.6rem;
    border-left:4px solid var(--red-peru);
    box-shadow:0 4px 14px rgba(20,20,50,.05);
  }
  .service-card h3{margin:0 0 .5rem; font-size:1rem; color:var(--indigo-deep);}
  .service-card p{margin:0; font-size:.94rem; color:#4a4536;}
  .service-note{
    margin-top:2rem; padding:1.2rem 1.4rem;
    background:var(--indigo-deep); color:var(--stone);
    border-radius:8px; font-size:.94rem; text-align:center;
  }
  .service-note strong{color:var(--gold-bright);}

  /* ---- Comércio internacional ---- */
  .country-grid{
    display:grid; gap:.9rem;
    grid-template-columns:repeat(auto-fill, minmax(170px,1fr));
  }
  .country-card{
    background:#fff; border:1px solid #e4dabf;
    border-radius:8px; padding:.9rem 1rem;
    display:flex; align-items:center; gap:.7rem;
  }
  .country-card .flag{font-size:1.6rem; line-height:1;}
  .country-card .name{font-size:.9rem; font-weight:600; color:var(--indigo-deep);}
  .country-card .cap{font-size:.76rem; color:#7a715c;}

  /* ---- Celebrações ---- */
  .cal-grid{
    display:grid; gap:1.2rem;
    grid-template-columns:repeat(auto-fit, minmax(260px,1fr));
  }
  .cal-card{
    background:#fff; border-radius:8px; overflow:hidden;
    border:1px solid #e4dabf;
  }
  .cal-date{
    background:var(--red-peru); color:#fff;
    padding:.6rem 1rem; font-family:'Cinzel', serif;
    font-size:.82rem; letter-spacing:.05em; text-transform:uppercase;
  }
  .cal-body{padding:1.1rem 1.2rem;}
  .cal-body h3{margin:0 0 .4rem; font-size:1rem; color:var(--indigo-deep);}
  .cal-body p{margin:0; font-size:.92rem; color:#4a4536;}

  /* ================= FOOTER ================= */
  footer{
    background:var(--indigo-deep); color:var(--stone);
    padding:2.6rem 1.2rem 1.6rem; text-align:center;
  }
  footer .brand-line{
    font-family:'Cinzel', serif; color:var(--gold-bright);
    margin-bottom:.6rem; font-size:1rem;
  }
  footer p{margin:.3rem 0; font-size:.86rem; opacity:.85;}
  footer .links{margin-top:1rem; display:flex; gap:1.4rem; justify-content:center; flex-wrap:wrap;}
  footer .links a{font-size:.82rem; text-decoration:none; color:var(--stone); border-bottom:1px solid rgba(255,255,255,.25);}

  /* reveal on scroll */
  .reveal{opacity:0; transform:translateY(16px); transition:opacity .6s ease, transform .6s ease;}
  .reveal.in{opacity:1; transform:none;}

  :focus-visible{outline:3px solid var(--gold-bright); outline-offset:2px;}
</style>
</head>
